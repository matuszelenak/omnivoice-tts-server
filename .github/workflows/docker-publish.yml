name: Build & publish Docker image

# Publishing is serialised across refs: a tag push and a branch push publish the
# same semver tags, and when they overlapped the older build could finish last and
# overwrite the newer image. Both builds are of the same commit, so the last one
# to finish now always publishes identical content.
concurrency:
  group: docker-publish
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'frontend/**'
      - '**.Dockerfile'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen --group dev
      - name: Lint
        working-directory: server
        run: uv run ruff check app tests ../bench ../scripts
      - name: Unit and API tests (model stubbed, no GPU)
        working-directory: server
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1
      - name: Install dependencies (from the committed lockfile)
        working-directory: frontend
        run: deno install --frozen
      - name: Type-check the Svelte app
        working-directory: frontend
        run: deno task check

  build-and-push:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The CUDA/torch stack makes this image very large; reclaim runner disk
      # that would otherwise be exhausted mid-build.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prod.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend. mode=max also caches intermediate
          # stages (the Deno frontend build), not just the final image layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
