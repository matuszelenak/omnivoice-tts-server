[project]
name = "omnivoice-tts-server"
version = "0.1.0"
description = "Production text-to-speech server for the OmniVoice model"
requires-python = ">=3.10,<3.13"
dependencies = [
    "blingfire>=0.1.8",
    "fastapi>=0.136.3",
    "granian>=2.5",
    "logfire[fastapi]>=4.34.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "openai>=1.60",
    "omnivoice>=0.1.5",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "torchaudio>=2.6",
    "uvicorn[standard]>=0.34",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E402",  # main.py silences the ML stack before importing it
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends()/File() defaults are the idiom
]

[tool.ruff.lint.per-file-ignores]
"../bench/*" = ["E402", "E501", "E702", "F841"]
"../scripts/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `uv run pytest` (CI) does not put the working directory on sys.path the way
# `python -m pytest` does, so make the `app` package importable explicitly.
pythonpath = ["."]
