stages:
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # The heavy CUDA/torch install is cached between pipelines.
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

lint-and-test:
  stage: test
  image: ghcr.io/astral-sh/uv@sha256:929560df6a6231d0509739319bc214aaa1e78838ce1f779b1faeb877c23a50d8
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache]
  script:
    - cd server
    - uv sync --frozen --group dev
    - uv run ruff check app tests ../bench ../scripts
    # Unit/API tests stub the model: no GPU needed in CI.
    - uv run pytest -q

frontend-check:
  stage: test
  image: denoland/deno:2.8.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd frontend
    - deno install --frozen
    - deno task check

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - server/**/*
        - frontend/**/*
        - "*.Dockerfile"
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
    - docker image prune --all --force
    - df -h /
    - docker buildx create --use --name builder
  script:
    - |
      TAGS="--tag omnivoice-tts-server:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --tag omnivoice-tts-server:${CI_COMMIT_BRANCH} --tag omnivoice-tts-server:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
        TAGS="$TAGS --tag omnivoice-tts-server:${VERSION} --tag omnivoice-tts-server:${MAJOR_MINOR}"
      fi
      docker buildx build \
        --file prod.Dockerfile \
        --load \
        $TAGS \
        .
