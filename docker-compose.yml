# Development stack: hot-reloading API (port 9001) + Vite dev server (port 5173).
#
#   docker compose up --watch
#
# The TTS model runs on GPU 0; the sibling parakeet-asr-server (port 9000) runs
# on GPU 1 and is used only to transcribe voice references.
services:
  server:
    container_name: omnivoice-tts-server
    build:
      context: server
    ports:
      - "9001:9001"
    environment:
      DEVICE: ${DEVICE:-cuda:0}
      DTYPE: ${DTYPE:-auto}
      VOICE_SAMPLES_DIR: ${VOICE_SAMPLES_DIR:-/app/voices}
      ASR_URL: ${ASR_URL:-http://host.docker.internal:9000}
      NUM_STEPS: ${NUM_STEPS:-16}
      FIRST_CHUNK_STEPS: ${FIRST_CHUNK_STEPS:-12}
      TORCH_COMPILE: ${TORCH_COMPILE:-true}
      CUDA_GRAPHS: ${CUDA_GRAPHS:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - ${HF_HOME:-./server/models}:/cache/hf
      - ${HF_HOME:-./server/cache}:/cache/torch
      - ./server/voices:${VOICE_SAMPLES_DIR:-/app/voices}
    extra_hosts:
      # Reach the parakeet-asr-server container published on the host.
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./server/app
          target: /app/app
        - action: rebuild
          path: ./server/pyproject.toml

  frontend:
    build:
      context: ./frontend
      target: dev
    image: omnivoice-tts-frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://server:9001}
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/deno.json
